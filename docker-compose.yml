version: '3.8'

services:
  # Low-Latency Redis Feature Store
  redis:
    image: redis:7-alpine
    container_name: riskiq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # Razorpay RiskIQ API Service
  api:
    build: .
    container_name: riskiq-api
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      - redis
    restart: always

volumes:
  redis_data:
