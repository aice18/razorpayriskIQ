name: Razorpay RiskIQ CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Test Suite
        run: |
          pytest -v

      - name: Run Held-Out Evaluation Harness
        run: |
          python -m eval.evaluate

      - name: Validate Metric Thresholds
        run: |
          python -c "
          import json
          with open('eval/results/eval_report.json') as f:
              data = json.load(f)
          metrics = data['performance_metrics']
          assert metrics['recall'] >= 0.90, f'Recall dropped below target: {metrics[\"recall\"]}'
          assert metrics['ring_detection_recall'] >= 0.90, f'Ring recall dropped: {metrics[\"ring_detection_recall\"]}'
          print('CI Metric Threshold Check Passed!')
          "
